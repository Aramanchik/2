<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Площадь треугольника</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <img src="icons/icon-192.png" alt="Иконка приложения" class="app-icon">
      <h1>Площадь треугольника</h1>
      <p class="subtitle">Формула Герона</p>
    </header>

    <div class="field">
      <label for="sideA">Сторона A, см</label>
      <input id="sideA" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Например, 3">
    </div>

    <div class="field">
      <label for="sideB">Сторона B, см</label>
      <input id="sideB" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Например, 4">
    </div>

    <div class="field">
      <label for="sideC">Сторона C, см</label>
      <input id="sideC" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Например, 5">
    </div>

    <div class="field">
      <label for="area">Площадь, см²</label>
      <input id="area" type="text" readonly placeholder="Результат">
    </div>

    <button id="calcBtn" type="button">Рассчитать площадь</button>
    <p id="message" class="message" role="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
